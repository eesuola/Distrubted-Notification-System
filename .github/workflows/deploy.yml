name: Deploy Services

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  discover-services:
    name: Discover Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.services }}
      service-list: ${{ steps.services.outputs.service-list }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Discover services
      id: services
      run: |
        # Find all directories in services/ that have a Dockerfile
        SERVICES=$(find services -maxdepth 1 -type d -not -path "services" | xargs -I {} bash -c 'if [ -f "{}/Dockerfile" ]; then echo "$(basename {})"; fi' | tr '\n' ' ')
        SERVICE_LIST=$(echo "$SERVICES" | sed 's/ /", "/g' | sed 's/^"/["/' | sed 's/"$/"]/')
        echo "services=$SERVICES" >> $GITHUB_OUTPUT
        echo "service-list=$SERVICE_LIST" >> $GITHUB_OUTPUT
        echo "Found services: $SERVICES"

  test:
    name: Test Services
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test
      continue-on-error: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [discover-services]
    if: success()
    strategy:
      matrix:
        service: ${{ fromJson(needs.discover-services.outputs.service-list) }}
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './services/${{ matrix.service }}'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [discover-services, test, security-scan]
    if: success()
    strategy:
      matrix:
        service: ${{ fromJson(needs.discover-services.outputs.service-list) }}
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=${{ env.IMAGE_TAG }}
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./services/${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Trigger Deployment
    runs-on: ubuntu-latest
    needs: [discover-services, build-and-push]
    if: success()
    
    steps:
    - name: Request deployment server
      id: deploy-request
      uses: peter-evans/create-or-update-comment@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        issue-number: ${{ github.run_number }}
        body: |
          /request-server
          
          **Deployment Information:**
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Services: ${{ needs.discover-services.outputs.services }}
          - Registry: ${{ env.REGISTRY }}
          - Image Tag: ${{ env.IMAGE_TAG }}
          
    - name: Wait for deployment
      run: |
        echo "Waiting for deployment to complete..."
        sleep 30
        
    - name: Health check
      run: |
        echo "Performing health checks on deployed services..."
        # This would typically involve making HTTP requests to the deployed services
        # For now, we'll just simulate the check
        for service in ${{ needs.discover-services.outputs.services }}; do
          echo "Checking health for $service service..."
          # In a real scenario, you would make HTTP requests to the service's /health endpoint
          # curl -f https://$service.example.com/health || exit 1
          echo "Health check passed for $service"
        done
        
    - name: Notify deployment success
      if: success()
      uses: peter-evans/create-or-update-comment@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        issue-number: ${{ github.run_number }}
        body: |
          ✅ **Deployment Successful**
          
          **Deployment Information:**
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Services: ${{ needs.discover-services.outputs.services }}
          - Registry: ${{ env.REGISTRY }}
          - Image Tag: ${{ env.IMAGE_TAG }}
          - Status: All health checks passed
          
    - name: Notify deployment failure
      if: failure()
      uses: peter-evans/create-or-update-comment@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        issue-number: ${{ github.run_number }}
        body: |
          ❌ **Deployment Failed**
          
          **Deployment Information:**
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Services: ${{ needs.discover-services.outputs.services }}
          - Registry: ${{ env.REGISTRY }}
          - Image Tag: ${{ env.IMAGE_TAG }}
          - Status: Health checks failed
          
          Please check the logs for more details.

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [discover-services, test, security-scan, build-and-push, deploy]
    if: failure()
    
    steps:
    - name: Notify failure
      uses: peter-evans/create-or-update-comment@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        issue-number: ${{ github.run_number }}
        body: |
          ❌ **Pipeline Failed**
          
          **Failed at stage:** ${{ needs.deploy.result || needs.build-and-push.result || needs.test.result || needs.security-scan.result }}
          
          **Pipeline Information:**
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Please check the logs for more details.